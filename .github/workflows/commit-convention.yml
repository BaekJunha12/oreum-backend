# PR의 커밋 메시지와 PR 제목이 [태그] 한 줄 규칙을 지키는지 검사
name: commit-convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]   # 제목 수정(edited)도 다시 검사

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                                 # base..head 커밋 목록을 보려면 전체 이력 필요

      - name: Check commit messages
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          status=0
          for sha in $(git rev-list --no-merges "$base..$head"); do   # 머지 커밋은 제외
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! scripts/check-commit-msg.sh /tmp/msg; then
              echo "  ↳ commit ${sha:0:7}"
              status=1
            fi
          done
          exit $status

      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}           # 스쿼시 머지 시 이 제목이 커밋 메시지가 됨
        run: |
          printf '%s\n' "$TITLE" > /tmp/title
          scripts/check-commit-msg.sh /tmp/title
